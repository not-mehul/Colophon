<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0b" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Colophon</title>
    <script>
      // Set the theme before the first paint, so there is no flash (style.md §14).
      // Colophon 2 kept it under colophon:theme as dusk or dawn.
      try {
        var mode = localStorage.getItem('colophon.theme') || localStorage.getItem('colophon:theme');
        var dark = mode === 'dark' || mode === 'dusk' || (mode !== 'light' && mode !== 'dawn' && !matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
