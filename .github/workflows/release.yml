name: Release

# Push a vX.Y.Z tag, or publish a release with a new tag from GitHub's
# release page. This builds Colophon as one HTML file and attaches it to that
# release (a new draft if there isn't one). The version comes from the tag;
# nothing in the repository needs bumping.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Publishing from the web page creates the tag and the release, which can
# start this twice. One build per tag.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the HTML file
        run: |
          version="${VERSION#v}"
          npm version --no-git-tag-version --allow-same-version "$version"
          npm run build
          cp dist/index.html colophon.html

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$VERSION" colophon.html --clobber \
            || gh release create "$VERSION" colophon.html --draft --verify-tag --title "Colophon $VERSION" \
                 --notes "Download colophon.html and open it in a browser. Everything is in that one file; it needs no install and works offline."
